name: ci

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development gates
        run: python -m pip install -e ".[dev,docs]"
      - name: Run tests
        run: python -m pytest

  release-package:
    name: package smoke (Windows, Python 3.12)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and release gates
        run: python -m pip install -e ".[dev,docs]"
      - name: Lint, format-check, and build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $dist = Join-Path $env:RUNNER_TEMP "cfdpaper-dist"
          python -m ruff check --no-cache .
          python -m ruff format --check --no-cache .
          python -m build --outdir $dist
          $wheels = @(Get-ChildItem -LiteralPath $dist -Filter "*.whl" -File)
          $sdists = @(Get-ChildItem -LiteralPath $dist -Filter "*.tar.gz" -File)
          if ($wheels.Count -ne 1 -or $sdists.Count -ne 1) {
            throw "expected one wheel and one sdist; found $($wheels.Count) wheel(s) and $($sdists.Count) sdist(s)"
          }
      - name: Install the wheel in isolation and smoke-test the CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $dist = Join-Path $env:RUNNER_TEMP "cfdpaper-dist"
          $smoke = Join-Path $env:RUNNER_TEMP "cfdpaper-wheel-smoke"
          $project = Join-Path $env:RUNNER_TEMP "cfdpaper-cli-project"
          $generatedProject = Join-Path $env:RUNNER_TEMP "cfdpaper-generated-topic-project"
          $candidates = Join-Path $env:RUNNER_TEMP "cfdpaper-candidates.json"
          $wheels = @(Get-ChildItem -LiteralPath $dist -Filter "*.whl" -File)
          if ($wheels.Count -ne 1) {
            throw "expected one wheel for smoke testing; found $($wheels.Count)"
          }
          $wheel = $wheels[0]
          python -m venv $smoke
          $smokePython = Join-Path $smoke "Scripts\python.exe"
          $cfdpaper = Join-Path $smoke "Scripts\cfdpaper.exe"
          & $smokePython -m pip install --no-cache-dir "$($wheel.FullName)[docs]"
          Set-Location $env:RUNNER_TEMP
          & $smokePython -c "import importlib.metadata as m, pathlib, sys; import cfdpaper; import cfdpaper.topic_generation; root=pathlib.Path(sys.prefix).resolve(); module=pathlib.Path(cfdpaper.__file__).resolve(); dist=m.distribution('cfd-paper-agent'); files=tuple(item.as_posix() for item in (dist.files or ())); assert module.is_relative_to(root), (module, root); assert dist.version == cfdpaper.__version__ == '0.15.0'; assert any(item.endswith('licenses/LICENSE') for item in files), files; assert any(item.endswith('licenses/NOTICE') for item in files), files; print(module)"
          & $cfdpaper --help
          New-Item -ItemType Directory -Path $project | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $project "synthetic.csv"),
            "case,value`nreference,1.0`n",
            [Text.UTF8Encoding]::new($false)
          )
          $candidatePayload = @{
            schema_version = 1
            candidates = @(
              @{
                topic_id = "ci-smoke-topic"
                title = "Synthetic screening topic"
                research_question = "What can be concluded from the synthetic screening case?"
              }
            )
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText(
            $candidates,
            $candidatePayload,
            [Text.UTF8Encoding]::new($false)
          )
          & $cfdpaper init $project --project-id ci-smoke
          & $cfdpaper inspect $project
          & $cfdpaper plan $project --candidates $candidates
          & $cfdpaper status $project
          & $smokePython (Join-Path $env:GITHUB_WORKSPACE "examples\generated-topic\prepare_project.py") $generatedProject
          & $cfdpaper plan $generatedProject --provider offline
          & $smokePython -c "from importlib.resources import files; p=files('cfdpaper').joinpath('skills'); assert len(list(p.iterdir())) == 5; assert p.joinpath('cfd-paper-workflow/SKILL.md').is_file(); assert p.joinpath('cfd-evidence-writing/references/mechanism-subsections.md').is_file()"
          $sectionSource = Join-Path $env:RUNNER_TEMP "section-source"
          $sectionPackage = Join-Path $env:RUNNER_TEMP "section-package"
          $sectionOutput = Join-Path $env:RUNNER_TEMP "section-output"
          & $smokePython (Join-Path $env:GITHUB_WORKSPACE "examples\section-writing\prepare_example.py") $sectionSource
          & $cfdpaper write $sectionSource --artifact results-section --section-input "$sectionSource/input.json" --output $sectionPackage
          & $cfdpaper write $sectionSource --artifact results-section --package $sectionPackage --draft "$sectionSource/sample-draft.json" --output $sectionOutput
          & $cfdpaper write $sectionSource --artifact results-section --package $sectionOutput --docx --output "$sectionOutput.docx"
          & $cfdpaper write $sectionSource --artifact results-section --package $sectionOutput --docx --layout near-reference --output "$sectionOutput-near.docx"
          & $smokePython -c "import zipfile, pathlib, json, xml.etree.ElementTree as E; p=pathlib.Path(r'$sectionOutput.docx'); z=zipfile.ZipFile(p); assert sum(n.startswith('word/media/') for n in z.namelist()) == 2; root=E.fromstring(z.read('word/document.xml')); ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main','m':'http://schemas.openxmlformats.org/officeDocument/2006/math'}; assert root.findall('.//w:tbl',ns); assert root.findall('.//m:oMath',ns); assert json.loads(p.with_suffix('.layout.json').read_text(encoding='utf-8')); source=pathlib.Path(r'$sectionSource'); assert len(list(source.glob('*.tiff'))) == 2; assert len(list(source.glob('*.svg'))) == 2"
          $analysisOutput = Join-Path $env:RUNNER_TEMP "material-analysis-example"
          & $smokePython (Join-Path $env:GITHUB_WORKSPACE "examples\material-analysis\run_example.py") $analysisOutput
          $materialSource = Join-Path $env:GITHUB_WORKSPACE "examples\material-analysis\inputs"
          & $cfdpaper inspect $materialSource --materials --find "area" --material-path method.md --output "$analysisOutput-matches"
          & $cfdpaper plan $materialSource --artifact analysis --material-path regions.csv --material-path method.md --output "$analysisOutput-selected"
          & $smokePython -c "import json,pathlib; p=pathlib.Path(r'$analysisOutput-matches'); m=json.loads((p/'material-matches.json').read_text()); assert m['matches']; p=pathlib.Path(r'$analysisOutput-selected'); m=json.loads((p/'materials.json').read_text()); assert set(m['source_files'])=={'sources/regions.csv','sources/method.md'}"
          & $smokePython -c "from pathlib import Path; from docx import Document; p=Path(r'$analysisOutput'); d=Document(p/'section.docx'); assert len(d.tables)==1; assert len(d.inline_shapes)==0; assert (p/'section-input/writing/skills/cfd-evidence-writing/references/mechanism-subsections.md').is_file()"
          $manuscriptSource = Join-Path $env:RUNNER_TEMP "manuscript-source"
          $manuscriptPackage = Join-Path $env:RUNNER_TEMP "manuscript-package"
          $manuscriptOutput = Join-Path $env:RUNNER_TEMP "manuscript-output"
          $continued = Join-Path $env:RUNNER_TEMP "manuscript-continued"
          & $smokePython (Join-Path $env:GITHUB_WORKSPACE "examples\literature-manuscript\prepare_example.py") $manuscriptSource
          & $cfdpaper write . --artifact manuscript --manuscript-input "$manuscriptSource/manuscript-input.json" --output $manuscriptPackage
          & $cfdpaper write . --artifact manuscript --package $manuscriptPackage --draft "$manuscriptSource/drafts.json" --output $manuscriptOutput
          & $cfdpaper write . --artifact manuscript --package $manuscriptOutput --draft "$manuscriptOutput/drafts.json" --output $continued
          & $cfdpaper write . --artifact manuscript --package $continued --docx --layout near-reference --output "$continued.docx"
          & $smokePython -c "from pathlib import Path; from docx import Document; import json; p=Path(r'$continued'); d=Document(str(p)+'.docx'); assert len(d.tables)==1; assert len(d.inline_shapes)==2; assert sum(x.style.name=='Heading 1' for x in d.paragraphs)==7; assert len(json.loads((p/'section.json').read_text(encoding='utf-8'))['references'])==1; assert (p/'CHANGES.md').is_file(); assert (p/'sections/introduction/review-packet/literature-support.json').is_file(); assert any(x.text.startswith('Keywords:') for x in d.paragraphs); assert (p/'CONTINUE.md').is_file(); assert (p/'sections/methods/skills/cfd-evidence-writing/references/methods-sections.md').is_file(); from cfdpaper.publication.figure_tasks import prepare_figure_task, import_figure_task; from importlib.resources import files; assert files('cfdpaper').joinpath('skills/cfd-figure-production/references/external-backends.md').is_file()"
          & $smokePython (Join-Path $env:GITHUB_WORKSPACE "examples\literature-manuscript\review_example.py") $continued (Join-Path $env:RUNNER_TEMP "manuscript-review-roundtrip")
      - name: Replay spatial diagnostics using the installed wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $smokePython = Join-Path $env:RUNNER_TEMP "cfdpaper-wheel-smoke\Scripts\python.exe"
          $cfdpaper = Join-Path $env:RUNNER_TEMP "cfdpaper-wheel-smoke\Scripts\cfdpaper.exe"
          $example = Join-Path $env:RUNNER_TEMP "spatial-example"
          $output = Join-Path $env:RUNNER_TEMP "spatial-output"
          $moved = Join-Path $env:RUNNER_TEMP "spatial-relocated"
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "examples\spatial-diagnostics") $example -Recurse
          Set-Location $env:RUNNER_TEMP
          & $smokePython (Join-Path $example "run_example.py") $output
          Move-Item -LiteralPath $output -Destination $moved
          & $smokePython -c "from pathlib import Path; from cfdpaper.publication.section import assemble_section; p=Path(r'$moved'); assemble_section(p/'section-input/writing',p/'recorded-host-draft.json',p/'reassembled')"
          & $cfdpaper write . --artifact results-section --package "$moved/reassembled" --docx --layout near-reference --output "$moved/spatial-diagnostics.docx"
          & $smokePython -c "from pathlib import Path; from docx import Document; p=Path(r'$moved'); d=Document(p/'spatial-diagnostics.docx'); t=d.tables[0]; assert len(d.tables)==1 and len(d.inline_shapes)==1; assert [c.text for c in t.rows[1].cells]==['Reference','45.60\u00a0°C','2.939\u00a0K']; assert [c.paragraphs[0].alignment for c in t.rows[0].cells]==[0,2,2]; assert 'weighted_population' in (p/'materials/skills/cfd-qoi-physics/SKILL.md').read_text(encoding='utf-8')"
          $arrays = Join-Path $env:RUNNER_TEMP "array-output"
          $relocatedArrays = Join-Path $env:RUNNER_TEMP "array-relocated"
          & $smokePython (Join-Path $example "run_array_example.py") $arrays
          Move-Item $arrays $relocatedArrays
          & $smokePython -c "from pathlib import Path; from cfdpaper.publication.section import assemble_section; p=Path(r'$relocatedArrays'); assemble_section(p/'section-input/writing',p/'draft.json',p/'reassembled')"
          & $cfdpaper write . --artifact results-section --package "$relocatedArrays/reassembled" --docx --layout near-reference --output "$relocatedArrays/array-demo.docx"
          & $smokePython -c "from pathlib import Path; from docx import Document; p=Path(r'$relocatedArrays'); d=Document(p/'array-demo.docx'); assert len(d.tables)==1 and len(d.inline_shapes)==0; assert [r.cells[1].text for r in d.tables[0].rows[1:]]==['315.000\u00a0K','308.571\u00a0K','320.000\u00a0K']; assert 'region_fraction' in (p/'materials/skills/cfd-qoi-physics/SKILL.md').read_text(encoding='utf-8')"
          & $smokePython -c "from pathlib import Path; import numpy as np; from cfdpaper.publication.section import assemble_section; p=Path(r'$relocatedArrays'); w=p/'section-input/writing'; np.savez(w/'sources/wall.npz',temperature=[300.,340.],area=[1.,3.],overlap=[1.,.25]); out=assemble_section(w,p/'draft.json',p/'updated'); text=(out/'section.md').read_text(encoding='utf-8'); assert all(text.count(n)==2 for n in ['330.000','317.143','340.000'])"
          $linked = Join-Path $env:RUNNER_TEMP "linked-output"
          $relocatedLinked = Join-Path $env:RUNNER_TEMP "linked-relocated"
          & $smokePython (Join-Path $example "run_linked_example.py") $linked
          Move-Item -LiteralPath $linked -Destination $relocatedLinked
          & $smokePython -c "from pathlib import Path; import json, math; from cfdpaper.publication.section import assemble_section; p=Path(r'$relocatedLinked'); out=assemble_section(p/'section-input/writing',p/'draft.json',p/'reassembled'); r=json.loads((out/'section.json').read_text(encoding='utf-8'))['resolved_values']; assert math.isclose(r['mean-change']['raw_value'],-2.2); assert math.isclose(r['spread-change']['raw_value'],2.4122475728); assert len(r['mean-change']['supporting_results'])==2"
          & $cfdpaper write . --artifact results-section --package "$relocatedLinked/reassembled" --docx --layout near-reference --output "$relocatedLinked/linked-demo.docx"
          & $smokePython -c "from pathlib import Path; from docx import Document; p=Path(r'$relocatedLinked'); d=Document(p/'linked-demo.docx'); assert len(d.tables)==1 and len(d.inline_shapes)==0; assert [r.cells[3].text for r in d.tables[0].rows[1:]]==['\u2212\u20602.200\u00a0K','2.412\u00a0K']"
          & $smokePython -c "from pathlib import Path; import json, math; from cfdpaper.publication.section import assemble_section; p=Path(r'$relocatedLinked'); w=p/'section-input/writing'; source=w/'sources/wall.csv'; text=source.read_text(encoding='utf-8'); assert text.count('Modified,6,9,10,58,1')==1; source.write_text(text.replace('Modified,6,9,10,58,1','Modified,6,9,10,98,1'),encoding='utf-8'); out=assemble_section(w,p/'draft.json',p/'updated'); r=json.loads((out/'section.json').read_text(encoding='utf-8'))['resolved_values']; assert math.isclose(r['mean-change']['raw_value'],1.8); assert (out/'section.md').read_text(encoding='utf-8').count('1.800')==2; assert (p/'reassembled/section.md').read_text(encoding='utf-8').count('-2.200')==2"
      - name: Replay connected writing from installed wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $smokePython = Join-Path $env:RUNNER_TEMP "cfdpaper-wheel-smoke\Scripts\python.exe"
          $cfdpaper = Join-Path $env:RUNNER_TEMP "cfdpaper-wheel-smoke\Scripts\cfdpaper.exe"
          $example = Join-Path $env:RUNNER_TEMP "connected-writing-example"
          $output = Join-Path $env:RUNNER_TEMP "connected-writing-output"
          $moved = Join-Path $env:RUNNER_TEMP "connected-writing-relocated"
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "examples\connected-writing") $example -Recurse
          Set-Location $env:RUNNER_TEMP
          & $smokePython (Join-Path $example "run_example.py") $output
          Move-Item -LiteralPath "$output/manuscript" -Destination $moved
          @'
          import json
          import sys
          from pathlib import Path
          from cfdpaper.publication.manuscript import assemble_manuscript, prepare_writing_context
          p = Path(sys.argv[1])
          old = (p / "manuscript.md").read_text(encoding="utf-8")
          source = p / "sections/results/sources/metrics.csv"
          text = source.read_text(encoding="utf-8")
          assert text.count("310.5,K") == text.count("125,Pa") == 1
          source.write_text(text.replace("310.5,K", "308.5,K").replace("125,Pa", "130,Pa"), encoding="utf-8")
          out = assemble_manuscript(p, p / "drafts.json", p.parent / "connected-updated")
          new = (out / "manuscript.md").read_text(encoding="utf-8")
          assert "-6.50 K" in new and "30.00 Pa" in new and "315.00 and 308.50" in new
          assert (p / "manuscript.md").read_text(encoding="utf-8") == old
          context = prepare_writing_context(p, "discussion", p.parent / "connected-context", drafts_path=p / "drafts.json")
          payload = json.loads((context / "context.json").read_text(encoding="utf-8"))
          assert payload["missing_dependency_drafts"] == [] and "keywords" in payload
          assert payload["sections"]["discussion"]["evidence"]["temperature-change"]["resolved"]["raw_value"] == -6.5
          '@ | & $smokePython - $moved
          & $cfdpaper write . --artifact manuscript --package "$env:RUNNER_TEMP/connected-updated" --docx --layout near-reference --output "$env:RUNNER_TEMP/connected-updated.docx"
          & $smokePython -c "from docx import Document; d=Document(r'$env:RUNNER_TEMP/connected-updated.docx'); assert len(d.tables)==1 and len(d.inline_shapes)==0; text=' '.join(c.text for r in d.tables[0].rows for c in r.cells); assert '308.50' in text and '130.00' in text"
      - name: Replay materials to manuscript from installed wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $smokePython = Join-Path $env:RUNNER_TEMP "cfdpaper-wheel-smoke\Scripts\python.exe"
          $example = Join-Path $env:RUNNER_TEMP "material-manuscript-example"
          $output = Join-Path $env:RUNNER_TEMP "material-manuscript-output"
          $moved = Join-Path $env:RUNNER_TEMP "material-manuscript-relocated"
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "examples\material-analysis") $example -Recurse
          Set-Location $env:RUNNER_TEMP
          & $smokePython (Join-Path $example "prepare_manuscript.py") $output
          Move-Item -LiteralPath "$output/manuscript" -Destination $moved
          @'
          import json
          import sys
          from pathlib import Path
          from zipfile import ZipFile
          from cfdpaper.publication.manuscript import assemble_manuscript
          from cfdpaper.publication.section import export_section_docx
          p = Path(sys.argv[1])
          before = json.loads((p / "section.json").read_text(encoding="utf-8"))
          out = assemble_manuscript(p, p / "drafts.json", p.parent / "material-manuscript-resumed")
          after = json.loads((out / "section.json").read_text(encoding="utf-8"))
          assert len(after["resolved_values"]) == 6
          assert before["resolved_values"] == after["resolved_values"]
          assert before["tables"] == after["tables"]
          docx = export_section_docx(out, out.with_suffix(".docx"), layout="near-reference")
          with ZipFile(docx) as archive:
              xml = archive.read("word/document.xml")
          assert b"<m:oMath>" in xml and b"<m:f>" in xml and b"<w:tbl>" in xml
          '@ | & $smokePython - $moved
      - name: Upload release distributions
        uses: actions/upload-artifact@v6
        with:
          name: cfd-paper-agent-0.15.0-distributions
          path: ${{ runner.temp }}/cfdpaper-dist/*
          if-no-files-found: error
