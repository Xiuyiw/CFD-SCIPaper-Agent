[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cfd-paper-agent"
version = "0.1.0"
description = "Author-in-the-loop CFD evidence, analysis, figure, and manuscript workflow"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "bluesarrow", email = "727197749@qq.com"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "rich>=13,<15",
]

[project.urls]
Homepage = "https://github.com/Xiuyiw/CFD-SCIPaper-Agent"
Repository = "https://github.com/Xiuyiw/CFD-SCIPaper-Agent.git"
Issues = "https://github.com/Xiuyiw/CFD-SCIPaper-Agent/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
rag = ["sentence-transformers>=3,<4"]
vtk = ["meshio>=5,<6"]
docs = ["python-docx>=1.1,<2"]

[project.scripts]
cfdpaper = "cfdpaper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cfdpaper"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/docs/architecture/legacy-migration.md",
  "/docs/architecture/V2_REFACTOR_PLAN.md",
  "/docs/architecture/workstream-protocol.md",
  "/docs/quality",
  "/docs/releases/v0.1.0-alpha_RELEASE_PLAN.md",
  "/docs/releases/v0.1.0_RELEASE_PLAN.md",
  "/docs/superpowers",
  "/docs/workstreams",
  "/private-fixtures",
  "/quality_reports",
  "/RELEASE_STATUS.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
